version: 2
updates:
  # Python deps (uv-managed pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels: ["deps", "python"]
    groups:
      python-patches:
        update-types: ["patch"]
      python-minor:
        update-types: ["minor"]
      # Majors arrive as their own grouped PR (previously they were silently
      # excluded and needed manual sweeps). The regression suite + smoke-gated
      # publish are the safety net.
      python-major:
        update-types: ["major"]

  # Frontend (Vite reader).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels: ["deps", "frontend"]
    groups:
      npm-patches:
        update-types: ["patch"]
      npm-minor:
        update-types: ["minor"]
      npm-major:
        update-types: ["major"]
    ignore:
      # pdf.js >=6 raises the browser floor to Chromium 125+ even in its
      # LEGACY build (mozilla/pdf.js#21152) — that broke PDF reading on the
      # household tablets / Android WebViews this reader serves. Stay on v5
      # (legacy floor: Chrome 110) until the device fleet clears 125.
      - dependency-name: "pdfjs-dist"
        update-types: ["version-update:semver-major"]

  # Docker base images (python:3.13-slim, node:24-alpine).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    labels: ["deps", "docker"]

  # GitHub Actions versions in the workflows themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    labels: ["deps", "ci"]
    groups:
      actions-all:
        patterns: ["*"]
