name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual tag suffix (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write           # push to GHCR
  id-token: write           # SBOM + (future) cosign signing
  security-events: write    # SARIF upload

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build + push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=despereaux
            org.opencontainers.image.description=Self-hosted ebook server with predictive page caching
            org.opencontainers.image.licenses=MIT

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release-notes:
    name: GitHub Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-push
    # softprops/action-gh-release calls the Releases API which requires
    # `contents: write` on GITHUB_TOKEN — the workflow-level default is
    # `contents: read` so we elevate just this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "## Changes since $PREV" > NOTES.md
            git log --pretty=format:'- %s (%h)' "$PREV"..HEAD >> NOTES.md
          else
            echo "## Initial release" > NOTES.md
            git log --pretty=format:'- %s (%h)' HEAD >> NOTES.md
          fi
          cat NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
          generate_release_notes: false
