name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # for Trivy SARIF upload

jobs:
  lint-test:
    name: Lint, test, audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # No floating v8 major tag exists (unlike v7) — pin the exact release.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps (incl. dev)
        run: uv sync --frozen --extra formats

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        env:
          DESPEREAUX_DEV_MODE: "true"
        run: uv run pytest --cov=despereaux --cov-report=term --cov-report=xml -q

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Export resolved requirements
        run: uv export --no-hashes --no-emit-project --output-file requirements.export.txt

      - name: pip-audit (resolved deps)
        run: uvx pip-audit --requirement requirements.export.txt --strict
        continue-on-error: true
        # continue-on-error for now — flip off after the first clean run so CVEs
        # actually block CI. Dependabot is the primary remediation channel.

  frontend-build:
    name: Frontend bundle (Vite/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: npm audit (production deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # don't block CI on transitive prod audit; Dependabot will PR fixes

  docker-build-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [lint-test, frontend-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: despereaux:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: despereaux:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'        # don't fail CI on findings; surface them in Code Scanning instead

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  smoke-test:
    name: Container smoke + reader e2e
    runs-on: ubuntu-latest
    needs: [docker-build-scan]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # No floating v8 major tag exists (unlike v7) — pin the exact release.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: docker/setup-buildx-action@v4

      # Rebuild from the gha cache the scan job just populated — effectively a
      # cache hit; gives this job the same image bytes under a stable tag.
      - name: Build image (cache hit)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: despereaux:ci
          cache-from: type=gha

      - name: Sync deps (incl. dev)
        run: uv sync --frozen --extra formats

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Seed smoke fixtures
        run: |
          mkdir -p .smoke/ebooks .smoke/config
          uv run python scripts/make_smoke_fixtures.py .smoke/ebooks

      - name: Start container
        run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 120

      # EPUB→MOBI inside the container: seeds the MOBI fixture for the
      # auto-convert check AND proves the Calibre toolchain runs on the
      # current base image.
      - name: Generate MOBI in-container (Calibre probe)
        run: >
          docker compose -f docker-compose.ci.yml exec -T despereaux
          ebook-convert /ebooks/sample.epub /ebooks/sample.mobi

      - name: Run smoke suite (black-box + browser)
        env:
          DESPEREAUX_SMOKE_URL: http://localhost:8810
          DESPEREAUX_SMOKE_RW: "1"
          DESPEREAUX_SMOKE_CONVERT: "1"
          DESPEREAUX_SMOKE_BROWSER: "1"
        run: uv run pytest tests/smoke -q

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  publish:
    name: Publish image (GHCR)
    runs-on: ubuntu-latest
    # Publishing is gated on the smoke tier: every image that reaches GHCR has
    # booted, migrated a fresh DB, scanned a library, converted a MOBI via
    # Calibre, and rendered an EPUB + PDF in a real browser.
    needs: [docker-build-scan, smoke-test]
    # Only on merge to main (push), never on PRs / forks. Fork PRs have no
    # package-write token and we never publish un-reviewed code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write   # create the version tag + GitHub release
      packages: write   # push the image to ghcr.io via the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags so the version bump can read prior tags

      - uses: docker/setup-buildx-action@v4

      # Rebuild from the gha cache (a cache hit — the scan job just populated it),
      # load locally so we gate on a clean Trivy scan BEFORE tagging/publishing.
      - name: Build for scan (cache hit)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: despereaux:publish-${{ github.sha }}
          cache-from: type=gha

      - name: Trivy gate (block publish on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: despereaux:publish-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Auto-version from conventional-commit messages since the last tag
      # (feat -> minor, fix -> patch, BREAKING CHANGE / "!" -> major; default
      # patch). Creates + pushes the vX.Y.Z git tag. Runs only after a clean scan
      # so we never tag a release we didn't publish. Tag pushes don't re-trigger
      # CI (the push trigger is filtered to branches: [main]).
      - name: Bump version + create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: GitHub release (auto changelog)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_version }}
            type=sha,format=short

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false
