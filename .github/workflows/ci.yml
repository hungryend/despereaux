name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # for Trivy SARIF upload

jobs:
  lint-test:
    name: Lint, test, audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync deps (incl. dev)
        run: uv sync --frozen --extra formats

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest with coverage
        env:
          DESPEREAUX_DEV_MODE: "true"
        run: uv run pytest --cov=despereaux --cov-report=term --cov-report=xml -q

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Export resolved requirements
        run: uv export --no-hashes --no-emit-project --output-file requirements.export.txt

      - name: pip-audit (resolved deps)
        run: uvx pip-audit --requirement requirements.export.txt --strict
        continue-on-error: true
        # continue-on-error for now — flip off after the first clean run so CVEs
        # actually block CI. Dependabot is the primary remediation channel.

  frontend-build:
    name: Frontend bundle (Vite/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Type-check + build
        working-directory: frontend
        run: npm run build

      - name: npm audit (production deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # don't block CI on transitive prod audit; Dependabot will PR fixes

  docker-build-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [lint-test, frontend-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: despereaux:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: despereaux:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'        # don't fail CI on findings; surface them in Code Scanning instead

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
