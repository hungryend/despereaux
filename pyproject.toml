[project]
name = "despereaux"
version = "0.1.0"
description = "Self-hosted ebook server with predictive page caching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # Direct pin of fastapi's transitive engine to keep the security floor explicit.
    "starlette>=1.6.0",  # CVE-2026-54283 (form-limit DoS), fixed in 1.3.1
    "uvicorn[standard]>=0.49",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22",
    "alembic>=1.19.1",
    "ebooklib>=0.20",
    "lxml>=6.1",
    "Pillow>=12.3",
    "jinja2>=3.1.6",
    "httpx>=0.28",
    "watchfiles>=1.2",
    "structlog>=26.1",
    "uuid-utils>=0.17.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14",
    "bcrypt>=5.0",
]

[project.optional-dependencies]
formats = [
    "pypdf>=6.16.0",
    "pypdfium2>=5.13.0",
    "rarfile>=4.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "httpx>=0.28",
    "pytest-playwright>=0.9.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/despereaux"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line length; black/ruff format handles long lines well enough
  "B008",   # Depends(...) in defaults is THE FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001"]   # auto-generated; don't fight the import order

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
