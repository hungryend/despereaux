[project]
name = "despereaux"
version = "0.1.0"
description = "Self-hosted ebook server with predictive page caching"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    # Direct pin of fastapi's transitive engine to keep the security floor explicit.
    "starlette>=1.3.1",  # CVE-2026-54283 (form-limit DoS), fixed in 1.3.1
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "ebooklib>=0.18",
    "lxml>=5.3",
    "Pillow>=11.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "watchfiles>=1.0",
    "structlog>=24.4",
    "uuid-utils>=0.10",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.10",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
formats = [
    "pypdf>=6.13.3",
    "pypdfium2>=5.10.1",
    "rarfile>=4.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/despereaux"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",   # line length; black/ruff format handles long lines well enough
  "B008",   # Depends(...) in defaults is THE FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["I001"]   # auto-generated; don't fight the import order

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
