## Copy this file to:
##   ${MOUNT_POINT}/swag/config/nginx/proxy-confs/despereaux.subdomain.conf
## Then: docker compose restart swag

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name despereaux.*;
    include /config/nginx/ssl.conf;

    # Books can be large; allow uploads + range responses to stream.
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;

    # Authentik forward-auth gate (same pattern as dash.subdomain.conf).
    include /config/nginx/authentik-server.conf;

    location / {
        include /config/nginx/authentik-location.conf;
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app despereaux;
        set $upstream_port 8000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Forward Authentik identity headers explicitly (belt-and-braces; the
        # authentik-location include also sets these).
        proxy_set_header X-authentik-username $upstream_http_x_authentik_username;
        proxy_set_header X-authentik-email    $upstream_http_x_authentik_email;
        proxy_set_header X-authentik-groups   $upstream_http_x_authentik_groups;
        proxy_set_header X-authentik-uid      $upstream_http_x_authentik_uid;
    }
}
