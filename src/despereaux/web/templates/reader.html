<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{ book.title }} — despereaux</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
    <link rel="stylesheet" href="/static/reader/assets/reader.css?v={{ asset_version }}" />
    <script>
      window.DESPEREAUX_BOOK = {
        id: {{ book.id|tojson }},
        title: {{ book.title|tojson }},
        format: {{ effective_format|tojson }},
        originalFormat: {{ book.format|tojson }},
        fileUrl: "/api/books/{{ book.id }}/file?v={{ file_version }}{% if original %}&original=1{% endif %}",
        manifestUrl: "/api/books/{{ book.id }}/manifest",
        progressUrl: "/api/books/{{ book.id }}/progress"
      };
    </script>
  </head>
  <body>
    <header class="reader-bar">
      <a class="back" href="/book/{{ book.id }}" title="Back to details">←</a>
      <div class="title">{{ book.title }}</div>
      <button id="toc-toggle" aria-label="Table of contents">☰</button>
    </header>
    <div id="reader-root"></div>
    <div id="reader-loading" role="status" aria-live="polite">
      <div class="reader-spinner" aria-hidden="true"></div>
      <p>Loading…</p>
    </div>
    <!-- Page-turn zones: full-height strips down the left and right edges, so a
         page turn is always under the thumb however the device is held. Real
         <button>s (keyboard + screen reader); reader.js adds tap/swipe/pan
         handling on top for touch. -->
    <button id="reader-prev" class="reader-nav reader-nav-prev" aria-label="Previous page" title="Previous (← key, tap the left edge, swipe right)"><span aria-hidden="true">‹</span></button>
    <button id="reader-next" class="reader-nav reader-nav-next" aria-label="Next page" title="Next (→ key, space, tap the right edge, swipe left)"><span aria-hidden="true">›</span></button>
    <aside id="toc-panel" hidden></aside>
    <script type="module" src="/static/reader/assets/reader.js?v={{ asset_version }}"></script>
  </body>
</html>
