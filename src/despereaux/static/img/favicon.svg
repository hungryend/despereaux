<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="despereaux">
  <title>despereaux</title>
  <!-- Solid dark square (so the gold reads at 16px) -->
  <rect width="64" height="64" rx="12" fill="#0e0f12"/>
  <!-- Stripped-down mouse face: head + two big ears -->
  <g fill="#d4a64b">
    <!-- Ears -->
    <circle cx="22" cy="22" r="9"/>
    <circle cx="42" cy="22" r="9"/>
    <!-- Head -->
    <circle cx="32" cy="34" r="14"/>
  </g>
  <!-- Inner ears -->
  <circle cx="22" cy="23" r="4.5" fill="#0e0f12"/>
  <circle cx="42" cy="23" r="4.5" fill="#0e0f12"/>
  <!-- Eyes -->
  <circle cx="27" cy="34" r="1.5" fill="#0e0f12"/>
  <circle cx="37" cy="34" r="1.5" fill="#0e0f12"/>
  <!-- Nose -->
  <ellipse cx="32" cy="41" rx="1.8" ry="1.2" fill="#0e0f12"/>
</svg>
